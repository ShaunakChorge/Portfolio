  <meta name="description" content="{{description}}">
  <meta name="author" content="Shaunak Chorge">

  <meta name="format-detection" content="telephone=no">

  <meta property="og:type" content="{{og_type}}">
  <meta property="og:site_name" content="Shaunak Chorge">

  <link rel="preload" href="{{base}}assets/fonts/orbitron-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{base}}assets/fonts/space-grotesk-var-latin.woff2" as="font" type="font/woff2" crossorigin>

  <script>
    /* progressive enhancement: content is readable without JS; [data-reveal] hides only under .js.
       Also restores the saved accent colour before first paint (no flash). */
    document.documentElement.classList.add('js');
    try { var a = localStorage.getItem('pf:accent'); if (a && /^(cyan|magenta|purple|green)$/.test(a)) document.documentElement.setAttribute('data-accent', a); } catch (e) {}
    try { if (localStorage.getItem('pf:motion') === 'paused') document.documentElement.classList.add('fx-paused'); } catch (e) {}
  </script>
  <!-- @css -->

{{jsonld}}
</head>
<body data-page="{{current}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="top"></div>

  <!-- page-fixed background: colour wash + 3 drifting orbs + shimmer + film grain (decorative) -->
  <div class="bg-fixed" aria-hidden="true">
    <div class="bg-wash"></div>
    <div class="bg-orbs"><i class="orb orb--cyan"></i><i class="orb orb--purple"></i><i class="orb orb--magenta"></i></div>
    <div class="bg-shimmer"></div>
    <div class="bg-grain"></div>
  </div>

  <div class="progress" aria-hidden="true"><span class="progress__bar"></span><span class="progress__head"></span></div>

  <header class="site-header">
    <div class="site-header__bar">
      <div class="site-header__in">
        <a class="logo" href="{{home}}" aria-label="Shaunak Chorge, home">
          <!-- electric-S mark (original artwork): cyan -> purple -> magenta -->
          <svg class="logo__mark" viewBox="0 0 64 64" fill="none" aria-hidden="true" focusable="false"><defs><linearGradient id="lg-mark" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse"><stop stop-color="#00FFFF"/><stop offset=".52" stop-color="#B553F2"/><stop offset="1" stop-color="#FF006E"/></linearGradient></defs><path d="M44.76 1L3 7.32L3 15.5L39.02 38.91L3 61.49L3 63L9.03 63L61 43L61 36.5L27.4 14.66L61 2.07L61 1Z" fill="url(#lg-mark)"/></svg>
          <span class="logo__word">SHAUNAK</span>
        </a>

        <nav class="nav" aria-label="Primary">
          <ul class="nav__list">
            <li><a class="nav__link" href="{{base}}projects/"{{aria:projects}}>Projects</a></li>
            <li><a class="nav__link" href="{{base}}services/"{{aria:services}}>Services</a></li>
            <li><a class="nav__link" href="{{base}}about/"{{aria:about}}>About</a></li>
            <li><a class="nav__link" href="{{base}}resume/"{{aria:resume}}>Resume</a></li>
          </ul>
          <span class="nav__ind" aria-hidden="true"></span>
        </nav>

        <div class="site-header__tools">
          <button class="cmd" type="button" data-open-palette aria-label="Search">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
          </button>
          <a class="btn btn--sm btn--solid btn--glow hdr-hire" href="{{base}}contact/#hire">Hire me <svg class="icon icon--sm icon--still" aria-hidden="true" focusable="false"><use href="#i-arrow-right"/></svg></a>
          <button class="burger" type="button" aria-expanded="false" aria-controls="drawer" aria-label="Open menu">
            <span class="burger__lines" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <nav class="drawer" id="drawer" aria-label="Mobile">
    <ul class="drawer__list">
      <li><a class="drawer__link" href="{{base}}projects/"{{aria:projects}} style="--i:0"><small>01</small>Projects</a></li>
      <li><a class="drawer__link" href="{{base}}services/"{{aria:services}} style="--i:1"><small>02</small>Services</a></li>
      <li><a class="drawer__link" href="{{base}}about/"{{aria:about}} style="--i:2"><small>03</small>About</a></li>
      <li><a class="drawer__link" href="{{base}}resume/"{{aria:resume}} style="--i:3"><small>04</small>Resume</a></li>
      <li><a class="drawer__link" href="{{base}}faq/"{{aria:faq}} style="--i:4"><small>05</small>FAQ</a></li>
      <li><a class="drawer__link" href="{{base}}contact/"{{aria:contact}} style="--i:5"><small>06</small>Contact</a></li>
    </ul>
    <div class="drawer__foot">
      <a class="btn btn--solid btn--glow btn--sm drawer__hire" href="{{base}}contact/#hire">Hire me <svg class="icon icon--sm icon--still" aria-hidden="true" focusable="false"><use href="#i-arrow-right"/></svg></a>
      <a class="icon-btn" href="https://github.com/ShaunakChorge" target="_blank" rel="noopener" aria-label="GitHub (opens in a new tab)"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-github"/></svg></a>
      <a class="icon-btn" href="https://www.linkedin.com/in/shaunak-chorge" target="_blank" rel="noopener" aria-label="LinkedIn (opens in a new tab)"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-linkedin"/></svg></a>
      <a class="icon-btn" href="mailto:shaunak.chorge@gmail.com" aria-label="Email Shaunak"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-mail"/></svg></a>
      <button type="button" class="btn btn--ghost btn--sm drawer__motion" data-motion-toggle aria-pressed="false" hidden><svg class="icon icon--sm icon--still" aria-hidden="true" focusable="false"><use href="#i-pause"/></svg> Pause effects</button>
    </div>
  </nav>

  <nav class="rail" aria-label="Page sections" hidden><ol class="rail__list"></ol></nav>

  <main id="main" tabindex="-1">
{{content}}
  </main>
