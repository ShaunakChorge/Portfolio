<section class="contact section" id="contact">
  <h2 class="section__title">Contact me</h2>
  <span class="section__subtitle">Get in touch</span>
  <div class="contact__container container grid">
    <div>
      <div class="contact__information">
        <a class="contact__icon" href="tel:+1234567890">
          <i class="uil uil-phone"></i>
          <!-- Phone icon -->
        </a>
        <div>
          <h3 class="contact__title">Phone</h3>
          <span class="contatc__subtitle">(+91) 9920644655</span>
          <!-- Replace with your actual phone number -->
        </div>
      </div>
      <div class="contact__information">
        <a class="contact__icon" href="mailto:shaunak.chorge@gmail.com">
          <i class="uil uil-envelope"></i>
        </a>
        <div>
          <h3 class="contact__title">E-mail</h3>
          <span class="contatc__subtitle">shaunak.chorge@gmail.com</span>
        </div>
      </div>
      <div class="contact__information">
        <i class="uil uil-map-marker contact__icon"></i>
        <div>
          <h3 class="contact__title">Location</h3>
          <span class="contatc__subtitle">Mumbai/Pune, India</span>
        </div>
      </div>
    </div>
    <!-- Updated Form -->
    <form
      action="https://formspree.io/f/xjkvyvjp"
      class="contact__form grid"
      method="POST"
    >
      <div class="contact__inputs grid">
        <div class="contact__content">
          <label class="contact__label" for="name">Name</label>
          <input
            class="contact__input"
            id="name"
            name="name"
            required=""
            type="text"
          />
        </div>
        <div class="contact__content">
          <label class="contact__label" for="email">E-mail</label>
          <input
            class="contact__input"
            id="email"
            name="email"
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
            required=""
            type="email"
          />
        </div>
      </div>
      <div class="contact__content">
        <label class="contact__label" for="subject">Subject</label>
        <input
          class="contact__input"
          id="subject"
          name="subject"
          required=""
          type="text"
        />
      </div>
      <div class="contact__content">
        <label class="contact__label" for="message">Message</label>
        <textarea
          class="contact__input"
          cols="0"
          id="message"
          name="message"
          required=""
          rows="7"
        ></textarea>
      </div>
      <div>
        <button class="button button--flex" type="submit">
          Send message
          <i class="uil uil-message button__icon"></i>
        </button>
      </div>
    </form>
  </div>
</section>
